exclude: "docs|node_modules|migrations|.git|.tox|scripts"
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      # Sort the imports
      - id: ruff
        name: ruff-sort-imports
        args: [--select, I, --fix]
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.71
    hooks:
      - id: ty
        # Provide the project dependencies ty needs in the isolated hook environment.
        entry: ty check
        additional_dependencies:
          - ty==0.0.71
          - dask
          - netCDF4
          - numpy>=2.0.0,<3.0.0
          - pytest
          - PyYAML
          - tqdm
          - xarray>=2024.03.0
          - types-PyYAML
          - types-pytz
          - types-tqdm
          - pandas-stubs
